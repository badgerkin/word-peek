<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 360px; height: 780px; overflow: hidden; font-family: Roboto, sans-serif; }
  body { background: #0F172A; position: relative; }
  .status { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: #fff; font-size: 14px; font-weight: 500; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .status .bar { width: 22px; height: 11px; border: 1.5px solid #fff; border-radius: 3px; position: relative; }
  .status .bar::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: #fff; border-radius: 1px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: .9; }
  .gesture { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 108px; height: 4px; border-radius: 2px; background: #E2E8F0; opacity: .8; }

  /* Host app (a generic reading app) */
  .host { background: #FAFAF7; position: absolute; top: 36px; left: 0; right: 0; bottom: 0; color: #1F2937; }
  .host .toolbar { height: 52px; display: flex; align-items: center; padding: 0 16px; font-size: 18px; font-weight: 500; border-bottom: 1px solid #E5E7EB; gap: 16px; }
  .host .toolbar .back { font-size: 22px; }
  .host article { padding: 18px 18px; font-size: 16px; line-height: 1.6; }
  .host h1 { font-size: 22px; line-height: 1.3; margin-bottom: 10px; }
  .host .meta { color: #6B7280; font-size: 13px; margin-bottom: 14px; }
  .host p { margin-bottom: 14px; }
  .sel { background: #BFDBFE; position: relative; }
  .handle { position: absolute; top: 100%; width: 18px; height: 18px; background: #2563EB; }
  .handle.l { left: -18px; border-radius: 50% 0 50% 50%; }
  .handle.r { right: -18px; border-radius: 0 50% 50% 50%; }
  .menu { position: absolute; background: #fff; border-radius: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.18); display: flex; gap: 20px; padding: 12px 18px; font-size: 14px; color: #111827; white-space: nowrap; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.40); }

  /* Word Peek sheet: values from res/layout/overlay_sheet.xml and res/values/styles.xml */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #1E293B; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; color: #E2E8F0; }
  .word { color: #fff; font-size: 22px; font-weight: 700; }
  .label { color: #94A3B8; font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-top: 16px; }
  .body { font-size: 15px; line-height: 1.38; margin-top: 6px; white-space: pre-line; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .row .label { margin-top: 0; }
  .lang { color: #60A5FA; font-size: 14px; font-weight: 700; }
  .langs { margin-top: 2px; }
  .langs div { padding: 8px 10px; font-size: 15px; }
  .langs div.on { color: #60A5FA; }
  .buttons { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
  .buttons span { color: #60A5FA; font-size: 15px; font-weight: 500; padding: 10px 14px; }

  /* Word Peek home screen: res/layout/activity_main.xml */
  .home { padding: 24px; color: #CBD5E1; }
  .home h1 { color: #fff; font-size: 32px; font-weight: 700; }
  .home .how { margin-top: 16px; font-size: 15px; line-height: 1.45; }
  .card { margin-top: 22px; background: #1E293B; border-radius: 24px; padding: 20px; }
  .card h2 { color: #fff; font-size: 18px; font-weight: 700; }
  .card .st { margin-top: 6px; font-size: 14.5px; line-height: 1.4; }
  .pill { display: inline-block; margin-top: 14px; background: #60A5FA; color: #0F172A; border-radius: 20px; padding: 10px 20px; font-size: 14px; font-weight: 500; }
  .switch { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 14.5px; gap: 12px; }
  .track { width: 44px; height: 24px; border-radius: 12px; background: #334155; position: relative; flex: none; }
  .track::after { content: ""; position: absolute; left: 4px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: #94A3B8; }
  .input { margin-top: 26px; border-bottom: 2px solid #94A3B8; padding: 8px 2px; font-size: 16px; color: #fff; }
</style>
</head>
<body>
<div class="status"><span>10:44</span><span class="icons"><span class="dot"></span><span class="dot"></span><span class="bar"></span></span></div>
<div id="scene"></div>
<div class="gesture"></div>

<template id="host">
  <div class="host">
    <div class="toolbar"><span class="back">←</span><span>Reader</span></div>
    <article>
      <h1>How leaves turn light into sugar</h1>
      <div class="meta">Science · 6 min read</div>
      <p>Every green leaf is a small factory. Through <span class="sel">photosynthesis<span class="handle l"></span><span class="handle r"></span></span>, plants capture sunlight and use it to turn water and carbon dioxide into sugars, releasing oxygen as a by-product.</p>
      <p>The process happens inside chloroplasts, where the pigment chlorophyll absorbs mostly red and blue light and reflects green.</p>
    </article>
    MENU
  </div>
</template>

<script>
const scene = new URLSearchParams(location.search).get('scene') || 'popup';
const root = document.getElementById('scene');
const host = document.getElementById('host').innerHTML;
const defn = `noun
1. (biology) Any process by which plants and other photoautotrophs convert light energy into chemical energy, typically using water and releasing oxygen as a by-product.`;
const wiki = `Photosynthesis is a system of biological processes by which photosynthetic organisms, such as most plants, algae and cyanobacteria, convert light energy, typically from sunlight, into the chemical energy necessary to fuel their metabolism.`;
const buttons = `<div class="buttons"><span>Copy</span><span>Close</span></div>`;

if (scene === 'popup') {
  root.innerHTML = host.replace('MENU', `<div class="menu" style="left:22px;top:146px">Copy &nbsp; Share &nbsp; Select all &nbsp; ⋮</div>`) + `
  <div class="sheet">
    <div class="word">photosynthesis</div>
    <div class="label">DEFINITION</div><div class="body">${defn}</div>
    <div class="label">WIKIPEDIA</div><div class="body">${wiki}</div>
    <div class="row"><div class="label">TRANSLATION</div><div class="lang">Spanish ▾</div></div>
    <div class="body">fotosíntesis</div>
    ${buttons}
  </div>`;
} else if (scene === 'languages') {
  const names = ['Spanish','French','German','Italian','Portuguese','Dutch','Russian','Japanese'];
  root.innerHTML = host.replace('MENU', '') + `
  <div class="sheet">
    <div class="word">photosynthesis</div>
    <div class="row"><div class="label">TRANSLATION</div><div class="lang">French ▾</div></div>
    <div class="langs">${names.map(n => `<div>${n}</div>`).join('')}</div>
    <div class="body">photosynthèse</div>
    ${buttons}
  </div>`;
} else if (scene === 'home') {
  root.innerHTML = `
  <div class="home">
    <h1>Word Peek</h1>
    <div class="how">Long-press a word in any app (Chrome, WhatsApp, Kindle, Reddit…). With instant pop-up on, a panel slides up with a dictionary definition, a Wikipedia summary and a translation, without leaving the app you're in.<br><br>Some apps don't report text selections to Android. There, pick "Word Peek" from the selection menu instead (you may need to tap ⋮ to see it).</div>
    <div class="card">
      <h2>Instant pop-up</h2>
      <div class="st">On. Long-press a word in any app to see its definition.</div>
      <div class="pill">Accessibility settings</div>
      <div class="switch"><span>Also pop up when selecting in text fields</span><span class="track"></span></div>
    </div>
    <div class="input" style="color:#64748B">Type a word to try it here</div>
    <div class="pill">Look it up</div>
  </div>`;
}
</script>
</body>
</html>
